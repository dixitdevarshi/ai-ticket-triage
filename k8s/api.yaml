apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ticket-triage-api
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://ticket_admin:ticket_pass_dev@postgres:5432/ticket_triage
            - name: ANOMALY_PROJECT_PATH
              value: /anomaly-project
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: anthropic-api-key
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: virustotal-api-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: slack-webhook-url
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: anomaly-project
              mountPath: /anomaly-project
      volumes:
        - name: anomaly-project
          hostPath:
            path: /anomaly-project
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
  type: NodePort