services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_RESTRICT_FILE_ACCESS_TO=/test-files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./test-files:/test-files

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ticket_admin
      - POSTGRES_PASSWORD=ticket_pass_dev
      - POSTGRES_DB=ticket_triage
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      - DATABASE_URL=postgresql://ticket_admin:ticket_pass_dev@postgres:5432/ticket_triage
    volumes:
      - D:/visual-anomaly-detection:/anomaly-project
    depends_on:
      - postgres

volumes:
  n8n_data:
  prometheus_data:
  grafana_data:
  postgres_data: